<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staircase + Walls</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
canvas{display:block}
#ui{position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.22);backdrop-filter:blur(14px);
  color:#111;padding:7px 22px;border-radius:30px;
  font:11px/1 'Courier New',monospace;pointer-events:none;
  white-space:nowrap;z-index:10;border:1px solid rgba(0,0,0,.12)}
#btn{position:fixed;bottom:18px;right:18px;
  background:rgba(255,255,255,.28);backdrop-filter:blur(10px);
  color:#111;padding:9px 18px;border-radius:20px;
  font:11px 'Courier New',monospace;cursor:pointer;z-index:10;
  border:1px solid rgba(0,0,0,.15)}
</style>
</head>
<body>
<div id="ui">Drag — rotate &nbsp;|&nbsp; Scroll — zoom &nbsp;|&nbsp; RMB — pan</div>
<button id="btn" onclick="toggleAuto()">⟳ Auto: ON</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.5,2000);
window.addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);buildSky();
});

var skyMesh;
function buildSky(){
  if(skyMesh)scene.remove(skyMesh);
  skyMesh=new THREE.Mesh(new THREE.SphereGeometry(1000,32,16),new THREE.ShaderMaterial({
    side:THREE.BackSide,
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 vP;void main(){float t=clamp((normalize(vP).y+0.1)*1.5,0.,1.);vec3 c=mix(vec3(.82,.91,.98),mix(vec3(.55,.78,.97),vec3(.24,.52,.87),t),t);gl_FragColor=vec4(c,1.);}'
  }));
  scene.add(skyMesh);
}
buildSky();

scene.add(new THREE.AmbientLight(0xe8f4ff,0.58));
var sun=new THREE.DirectionalLight(0xfff8e8,1.3);
sun.position.set(150,300,100);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);
sun.shadow.camera.left=-350;sun.shadow.camera.right=350;
sun.shadow.camera.top=300;sun.shadow.camera.bottom=-50;sun.shadow.camera.far=900;
scene.add(sun);
var fill=new THREE.DirectionalLight(0xc0d8ff,0.3);
fill.position.set(-80,60,-100);scene.add(fill);
scene.add(new THREE.HemisphereLight(0xb8d8ff,0x70a050,0.32));

// ── DIMENSIONS ──────────────────────────
var RISE=6, TREAD=12, W=84, STEPS=18;
var STAIR_Z = STEPS*TREAD;   // 216"  (back of last step)
var STAIR_H = STEPS*RISE;    // 108"

// Walls: start step 7, end step 18 (last step back face)
var WALL_Z0  = 6*TREAD;       // 72"  step-7 front face
var WALL_ZE  = STAIR_Z;       // 216" back of step 18
var WALL_LEN = WALL_ZE - WALL_Z0;   // 144"
var WALL_CZ  = WALL_Z0 + WALL_LEN/2; // 144"

var WALL_H   = 54;            // 54" tall from ground
var WALL_CY  = WALL_H/2;      // 27"

// Left wall: 49.5" wide, inner face at X=-42
var L_W  = 16.5;
var L_CX = -(W/2 + L_W/2);   // -66.75

// Right wall: 16.5" wide, inner face at X=+42
var R_W  = 49.5;
var R_CX = W/2 + R_W/2;       // +50.25

// ── TEXTURES ────────────────────────────
function makeStoneTex(){
  var C=256, cv=document.createElement('canvas'); cv.width=C; cv.height=C;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#9a8878'; ctx.fillRect(0,0,C,C);
  var rows=6, cols=4, bW=C/cols, bH=C/rows;
  for(var r=0;r<rows;r++) for(var cl=0;cl<cols;cl++){
    var ox=(r%2===0?bW/2:0), x=(cl*bW+ox)%C, y=r*bH;
    var g=118+Math.random()*42;
    ctx.fillStyle='rgb('+g+','+(g-10)+','+(g-22)+')';
    ctx.fillRect(x+2,y+2,bW-5,bH-5);
  }
  ctx.strokeStyle='#6a5a4a'; ctx.lineWidth=3;
  for(var r2=0;r2<=rows;r2++){ctx.beginPath();ctx.moveTo(0,r2*bH);ctx.lineTo(C,r2*bH);ctx.stroke();}
  for(var r3=0;r3<rows;r3++){
    var ox2=(r3%2===0?bW/2:0);
    for(var c2=0;c2<=cols;c2++){
      var xc=(c2*bW+ox2)%C;
      ctx.beginPath();ctx.moveTo(xc,r3*bH);ctx.lineTo(xc,(r3+1)*bH);ctx.stroke();
    }
  }
  var tex=new THREE.CanvasTexture(cv);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(4,3); return tex;
}
function makeGrassTex(){
  var C=128, cv=document.createElement('canvas'); cv.width=C; cv.height=C;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#5a8a38'; ctx.fillRect(0,0,C,C);
  for(var i=0;i<450;i++){
    ctx.fillStyle=Math.random()>.5?'rgba(88,148,50,.5)':'rgba(38,68,18,.4)';
    ctx.beginPath(); ctx.arc(Math.random()*C,Math.random()*C,Math.random()*4+1,0,Math.PI*2); ctx.fill();
  }
  var tex=new THREE.CanvasTexture(cv);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(3,3); return tex;
}

// ── MATERIALS ───────────────────────────
var mStep  = new THREE.MeshPhongMaterial({color:0xEDE0CE,shininess:15});
var mCap   = new THREE.MeshPhongMaterial({color:0xF7F0E4,shininess:32});
var mRiser = new THREE.MeshPhongMaterial({color:0xD4BFA0,shininess:8});
var mStone = new THREE.MeshPhongMaterial({map:makeStoneTex(),color:0xb0a090,shininess:6});
var mGrass = new THREE.MeshLambertMaterial({map:makeGrassTex(),color:0x78b050});

// ── HELPERS ─────────────────────────────
function box(x,y,z,w,h,d,mat){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}
function grassTop(cx,cz,w,len){
  var g=new THREE.Mesh(new THREE.BoxGeometry(w+0.5,3,len+0.5),mGrass);
  g.position.set(cx, WALL_H+1.5, cz); scene.add(g);
}
function makeLabel(lines,pw,ph){
  var PX=14, cw=Math.max(128,Math.round(pw*PX)), ch=Math.max(28,Math.round(ph*PX));
  var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
  var ctx=cv.getContext('2d'), lh=ch/lines.length;
  for(var i=0;i<lines.length;i++){
    var ml=0; for(var j=0;j<lines.length;j++) if(lines[j].length>ml) ml=lines[j].length; if(ml<1)ml=1;
    var fs=Math.max(8,Math.min(Math.round(lh*0.56),Math.round(cw/ml*1.05)));
    ctx.font='bold '+fs+'px Courier New,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    var y=(i+0.5)*lh;
    ctx.strokeStyle='rgba(255,255,255,0.97)'; ctx.lineWidth=Math.max(2,fs*0.28); ctx.lineJoin='round';
    ctx.strokeText(lines[i],cw/2,y); ctx.fillStyle='#0d0d0d'; ctx.fillText(lines[i],cw/2,y);
  }
  return new THREE.CanvasTexture(cv);
}
function lbl(x,y,z,rx,ry,rz,pw,ph,lines){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph),new THREE.MeshBasicMaterial({
    map:makeLabel(lines,pw,ph),transparent:true,opacity:0.94,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-4,side:THREE.DoubleSide
  }));
  m.rotation.set(rx,ry,rz); m.position.set(x,y,z); m.renderOrder=6; scene.add(m);
}

// ── STAIRCASE ───────────────────────────
for(var i=0;i<STEPS;i++){
  var topY=(i+1)*RISE, h=topY, frontZ=i*TREAD, cZ=frontZ+TREAD/2;
  box(0,h/2,cZ,W,h,TREAD,mStep);
  box(0,topY+0.7,cZ+0.8,W+0.4,1.4,TREAD+1.6,mCap);
  box(0,topY-RISE/2,frontZ+0.45,W,RISE,0.9,mRiser);
  lbl(0,topY+0.9,cZ,-Math.PI/2,0,0,70,10,['ST-'+(i+1),'84" x 12"']);
  lbl(0,topY-RISE/2,frontZ-0.8,0,Math.PI,0,64,5.2,['6" RISE']);
}

// ── LEFT WALL  49.5" wide, 54" tall, step7→step18 ───
box(L_CX, WALL_CY, WALL_CZ, L_W, WALL_H, WALL_LEN, mStone);
grassTop(L_CX, WALL_CZ, L_W, WALL_LEN);

// Labels — left wall
lbl(L_CX, WALL_H+2, WALL_CZ,
  -Math.PI/2,0,0, 47,16,
  ['LEFT WALL','16.5" x 144"','H: 54"']);
lbl(L_CX, WALL_CY, WALL_Z0-0.9,    // front face (−Z toward viewer)
  0,Math.PI,0, 47,16,
  ['LEFT WALL','16.5"W x 54"H']);
lbl(L_CX-L_W/2-0.9, WALL_CY, WALL_CZ,  // outer side face (−X)
  0,-Math.PI/2,0, 106,16,
  ['LEFT WALL  16.5"W x 54"H  144" deep']);

// ── RIGHT WALL  16.5" wide, 54" tall, step7→step18 ──
box(R_CX, WALL_CY, WALL_CZ, R_W, WALL_H, WALL_LEN, mStone);
grassTop(R_CX, WALL_CZ, R_W, WALL_LEN);

// Labels — right wall
lbl(R_CX, WALL_H+2, WALL_CZ,
  -Math.PI/2,0,0, 15,16,
  ['RT','49.5"','x144"']);
lbl(R_CX, WALL_CY, WALL_Z0-0.9,
  0,Math.PI,0, 15,16,
  ['RT','49.5"','54"H']);
lbl(R_CX+R_W/2+0.9, WALL_CY, WALL_CZ,
  0,Math.PI/2,0, 106,16,
  ['RIGHT WALL  49.5"W x 54"H  144" deep']);

// ── GRASS GROUND ────────────────────────
(function(){
  var cv=document.createElement('canvas'); cv.width=256; cv.height=256;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#607848'; ctx.fillRect(0,0,256,256);
  for(var i=0;i<2000;i++){
    ctx.fillStyle=Math.random()>.5?'rgba(96,144,56,.5)':'rgba(40,68,18,.4)';
    ctx.beginPath(); ctx.arc(Math.random()*256,Math.random()*256,Math.random()*4+1,0,Math.PI*2); ctx.fill();
  }
  var tex=new THREE.CanvasTexture(cv);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(60,60);
  var gnd=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),
    new THREE.MeshLambertMaterial({map:tex,color:0x88b060}));
  gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);
  var grid=new THREE.GridHelper(1400,100,0x4a6830,0x3a5224);
  grid.position.y=0.3; scene.add(grid);
})();

// ── CLOUDS ──────────────────────────────
(function(){
  var cv=document.createElement('canvas'); cv.width=300; cv.height=140;
  var ctx=cv.getContext('2d'); ctx.clearRect(0,0,300,140);
  var cl=[[90,70,60],[150,55,75],[210,65,55],[115,95,42],[175,88,40]];
  for(var i=0;i<cl.length;i++){
    var cx=cl[i][0],cy=cl[i][1],r=cl[i][2];
    var g=ctx.createRadialGradient(cx,cy,r*.08,cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.7,'rgba(235,245,255,.55)'); g.addColorStop(1,'rgba(200,225,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
  var tex=new THREE.CanvasTexture(cv);
  var pos=[[0,320,-200],[240,290,20],[-260,310,120],[120,270,200],[-140,345,-110]];
  for(var i=0;i<pos.length;i++){
    var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.85,depthWrite:false}));
    sp.position.set(pos[i][0],pos[i][1],pos[i][2]);
    var s=90+Math.random()*60; sp.scale.set(s*2.4,s,1); scene.add(sp);
  }
})();

// ── CAMERA ──────────────────────────────
var theta=Math.PI+0.45, phi=0.88, radius=330;
var target=new THREE.Vector3(0,50,144);
var autoRot=true;

function sync(){
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
sync();

var drag=false,rDrag=false,px=0,py=0;
renderer.domElement.addEventListener('mousedown',function(e){drag=true;rDrag=e.button===2;px=e.clientX;py=e.clientY;e.preventDefault();});
renderer.domElement.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('mouseup',function(){drag=false;});
window.addEventListener('mousemove',function(e){
  if(!drag)return;
  var dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  if(rDrag){
    var rv=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),
      new THREE.Vector3().subVectors(camera.position,target).normalize()).normalize();
    target.addScaledVector(rv,-dx*0.25);target.y+=dy*0.25;
  }else{theta-=dx*0.012;phi=Math.max(0.05,Math.min(Math.PI*0.92,phi-dy*0.012));}
  sync();
});
renderer.domElement.addEventListener('wheel',function(e){
  radius=Math.max(40,Math.min(900,radius*(1+e.deltaY*0.001)));sync();
},{passive:true});
var prevP=0;
renderer.domElement.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(e.touches.length===1){drag=true;rDrag=false;px=e.touches[0].clientX;py=e.touches[0].clientY;}
  if(e.touches.length===2){drag=false;prevP=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:false});
renderer.domElement.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===1&&drag){
    var dx=e.touches[0].clientX-px,dy=e.touches[0].clientY-py;
    px=e.touches[0].clientX;py=e.touches[0].clientY;
    theta-=dx*0.012;phi=Math.max(0.05,Math.min(Math.PI*0.92,phi-dy*0.012));sync();
  }
  if(e.touches.length===2){
    var p=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    radius=Math.max(40,Math.min(900,radius*(prevP/p)));prevP=p;sync();
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',function(){drag=false;});

function toggleAuto(){autoRot=!autoRot;document.getElementById('btn').textContent='⟳ Auto: '+(autoRot?'ON':'OFF');}
function animate(){requestAnimationFrame(animate);if(autoRot&&!drag){theta+=0.003;sync();}renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
